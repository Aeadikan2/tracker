{% extends 'base.html' %}

{% block content %}
<div class="dashboard">
    <header class="page-header">
        <h1>Dashboard</h1>
        <p class="subtitle">Track your income and budget splits</p>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Income</h3>
            <p class="stat-value">₦{{ "%.2f"|format(stats.total_income) }}</p>
        </div>
        <div class="stat-card">
            <h3>Total Savings</h3>
            <p class="stat-value">₦{{ "%.2f"|format(stats.total_savings) }}</p>
        </div>
        <div class="stat-card">
            <h3>Entries</h3>
            <p class="stat-value">{{ stats.entry_count }}</p>
        </div>
    </div>

    <div class="section-card">
        <h2>Add New Income</h2>
        <form action="{{ url_for('add_income') }}" method="POST" class="income-form">
            <div class="form-group">
                <label for="amount">Income Amount (₦)</label>
                <input type="number" step="0.01" id="amount" name="amount" required placeholder="e.g. 5000.00">
            </div>
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" value="{{ today }}" required>
            </div>
            <button type="submit" class="btn-primary">Calculate & Save</button>
        </form>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<div class="settings-page">
    <header class="page-header">
        <h1>Budget Settings</h1>
        <p class="subtitle">Customize your budget allocation percentages</p>
    </header>

    <div class="section-card">
        <form action="{{ url_for('settings') }}" method="POST" class="settings-form">
            <div class="grid-2">
                <div class="form-group">
                    <label for="savings">Savings (%)</label>
                    <input type="number" step="0.1" id="savings" name="savings" value="{{ savings }}" required>
                </div>
                <div class="form-group">
                    <label for="expenses">Expenses (%)</label>
                    <input type="number" step="0.1" id="expenses" name="expenses" value="{{ expenses }}" required>
                </div>
                <div class="form-group">
                    <label for="investments">Investments (%)</label>
                    <input type="number" step="0.1" id="investments" name="investments" value="{{ investments }}"
                        required>
                </div>
                <div class="form-group">
                    <label for="discretionary">Discretionary (%)</label>
                    <input type="number" step="0.1" id="discretionary" name="discretionary" value="{{ discretionary }}"
                        required>
                </div>
            </div>

            <div class="form-info">
                <p>Note: All percentages must add up to exactly 100%.</p>
            </div>

            <button type="submit" class="btn-primary">Update Settings</button>
        </form>
    </div>
</div>
{% endblock %}
